[project]
name = "contentlens-backend"
version = "0.1.0"
description = "FastAPI backend for ContentLens"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.12.0",
  "python-jose[cryptography]>=3.5.0",
  "supabase>=2.25.0",
  "uvicorn[standard]>=0.38.0"
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008"]
